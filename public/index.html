<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 가상 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    [hidden] { display: none !important; }
    form { display: grid; gap: 12px; max-width: 420px; }
    label { display: grid; gap: 6px; }
    input, button { padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #auth-message { min-height: 1.7em; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" defer></script>
  <script src="/auth-config.js" defer></script>
  <script src="/auth.js" defer></script>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 2단계 자료 이동</div>
    <h1>가상 자료실</h1>
    <p>실습용 가상 메모를 서버 함수를 통해 불러옵니다. 실제 개인정보는 넣지 마세요.</p>
    <div class="notice">아직 공개 조회 단계입니다. 로그인하지 않은 방문자도 서버 함수를 통해 가상 메모를 볼 수 있습니다.</div>
    <section aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-state" role="status">로그인 상태 확인 중…</p>
      <form id="login-form">
        <label>이메일<input id="login-email" name="email" type="email" autocomplete="username" required></label>
        <label>비밀번호<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="status" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    const list = document.querySelector('#notes');
    try {
      const response = await fetch('/api/notes', { cache: 'no-store', credentials: 'omit' });
      if (!response.ok) throw new Error('자료를 읽을 수 없습니다. 서버 설정을 확인하세요.');
      const data = await response.json();
      if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
      if (data.notes.length === 0) {
        list.textContent = '등록된 가상 메모가 없습니다.';
      } else {
      list.replaceChildren(...data.notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        title.textContent = note.title;
        content.textContent = note.content;
        item.append(title, content);
        return item;
      }));
      }
    } catch (error) {
      const item = document.createElement('li');
      item.textContent = error.message;
      list.replaceChildren(item);
    }
  </script>
</body>
</html>
